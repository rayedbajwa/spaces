name: aidlc-feature
version: 1
description: >
  Full AI-DLC lifecycle for new features at practical depth. Includes
  ideation, full inception, construction, and CI. Change control is relaxed
  (post-approval drift is announced in one line, run continues).
steps:
  # Per-stage models: haiku for mechanical, sonnet for design/impl, opus for deep architect stages.
  - id: state-init
    stage: init
    phase: initialization
    thinking: off
  - id: research
    stage: research
    phase: inception
    role: architect
  - id: intent-capture
    stage: specify
    phase: ideation
    role: product
    review: true
    humanGate: true
    thinking: medium
  - id: user-stories
    stage: clarify
    phase: inception
    role: product
    thinking: low
  - id: domain-design
    stage: plan
    phase: inception
    role: architect
    review: true
    humanGate: true
    thinking: high
  - id: contract-design
    stage: constitution
    phase: inception
    role: architect
    thinking: medium
  - id: units-generation
    stage: tasks
    phase: inception
    role: architect
    review: true
    humanGate: true
    thinking: medium
  - id: functional-design
    stage: testplan
    phase: construction
    role: quality
    review: true
    humanGate: true
    thinking: medium
  - id: delivery-planning
    stage: parallelize
    phase: construction
    role: delivery
    thinking: low
  - id: code-generation
    stage: implement
    phase: construction
    role: developer
    maxIterations: 3
    thinking: high
    parallel:
      source: parallel-workstreams.md
      maxConcurrency: 4
  - id: merge-orchestration
    stage: orchestrate
    phase: construction
    role: delivery
    review: true
    humanGate: true
    thinking: medium
  # Implementation harness: task execution (implement, PR opened) → CI checks →
  # code review posted on the PR → back to implement on CHANGES_REQUESTED → QA.
  - id: code-review
    stage: review
    phase: construction
    role: quality
    thinking: medium
    maxIterations: 4
    onComplete:
      branch:
        - when: "code_review_status == 'changes_requested'"
          goto: code-generation
        - when: "true"
          goto: build-and-test
  - id: build-and-test
    stage: verify
    phase: construction
    role: quality
    review: true
    humanGate: true
    thinking: medium
    onComplete:
      branch:
        - when: "verification_status == 'fail'"
          goto: code-generation
        - when: "verification_status == 'partial'"
          goto: code-generation
        - when: "true"
          goto: delivery
  # Drive PRs through review → merge (stack order) → deploy → UAT. Pauses at the
  # human gate; while anything is still open the loop re-runs deliver after
  # approval, which refreshes delivery-status.md from GitHub and re-checks.
  - id: delivery
    stage: deliver
    phase: construction
    role: developer
    review: true
    humanGate: true
    maxIterations: 20
    thinking: medium
    onComplete:
      branch:
        - when: "delivery_status == 'merged'"
          goto: end
        - when: "true"
          goto: delivery
