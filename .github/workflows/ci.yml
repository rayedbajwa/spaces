name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----- typecheck + frontend build + tests --------------------------------
  build:
    name: build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aidlc
          POSTGRES_PASSWORD: aidlc
          POSTGRES_DB: aidlc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aidlc -d aidlc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend
        run: bun run build:web

      - name: Apply DB schema
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
        run: bun run db:migrate

      # Provider keys belong to an organization now, not to the environment, so
      # the paths that need one (creating a project) require a stored key.
      - name: Seed a provider key for the default organization
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          ALLOW_UNVERIFIED_PROVIDER_KEY: "1"
        run: bun run scripts/seed-provider-key.ts anthropic ci-dummy-not-a-real-key-smoke-tests-skip-llm

      - name: Run tests (unit + DB integration, no HTTP server)
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
        # Explicitly exclude smoke.test.ts here — it needs a live web server,
        # and the dispatcher concurrency tests get flakier when other processes
        # touch project_jobs on the same DB, so we run smoke tests in a
        # separate step below with the server up.
        run: bun test tests/crypto-vault.test.ts tests/oauth.test.ts tests/dispatcher.test.ts tests/model-router.test.ts tests/context-compactor.test.ts tests/board-drop.test.ts tests/project-responsibilities.test.ts tests/project-responsibilities.integration.test.ts tests/project-responsibilities.workflow.test.ts

      - name: Start web server for smoke tests
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          # Env validation refuses to start without an LLM key. Smoke tests
          # never actually call the LLM — this dummy value just satisfies the
          # assertEnvOrExit guard so the server can boot.
          ANTHROPIC_API_KEY: ci-dummy-not-a-real-key-smoke-tests-skip-llm
          # The smoke tests exercise the API without a session; the auth gate
          # itself is checked separately below with a second server on :3001.
          AUTH_DISABLED: "1"
        run: |
          nohup bun run src/server.ts > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for web server
        run: timeout 30 sh -c 'until curl -sf http://localhost:3000/api/board >/dev/null; do sleep 1; done'

      - name: Auth gate smoke check (sign-in enabled)
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          ANTHROPIC_API_KEY: ci-dummy-not-a-real-key-smoke-tests-skip-llm
          PORT: "3001"
        run: |
          nohup bun run src/server.ts > server-auth.log 2>&1 &
          AUTH_PID=$!
          timeout 30 sh -c 'until curl -sf http://localhost:3001/api/auth/status >/dev/null; do sleep 1; done'
          status=$(curl -s http://localhost:3001/api/auth/status)
          echo "auth status: $status"
          echo "$status" | grep -q '"authEnabled":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/board)
          echo "unauthenticated /api/board -> $code"
          test "$code" = "401"
          kill "$AUTH_PID" 2>/dev/null || true

      - name: Run smoke tests
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
        run: bun test tests/smoke.test.ts

      # Responsibility API + security + browser tests need a session-bearing
      # server (auth enabled), so they get their own instance on :3100.
      - name: Start web server for responsibility tests
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          ANTHROPIC_API_KEY: ci-dummy-not-a-real-key-smoke-tests-skip-llm
          PORT: "3100"
        run: |
          nohup bun run src/server.ts > server-responsibilities.log 2>&1 &
          echo $! > server-responsibilities.pid

      - name: Wait for responsibility server
        run: timeout 30 sh -c 'until curl -sf http://localhost:3100/api/auth/status >/dev/null; do sleep 1; done'

      - name: Run responsibility API and security tests
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          RESPONSIBILITY_BASE_URL: http://localhost:3100
        run: bun test tests/project-responsibilities.api.test.ts tests/project-responsibilities.security.test.ts

      - name: Install browser for responsibility UI tests
        run: bun run setup:browsers

      - name: Run responsibility browser tests
        env:
          DATABASE_URL: postgres://aidlc:aidlc@localhost:5432/aidlc
          ENCRYPTION_KEY: ci-test-encryption-key-not-a-real-secret-value
          RESPONSIBILITY_BASE_URL: http://localhost:3100
        run: bun test tests/project-responsibilities.e2e.test.ts

      - name: Stop responsibility server
        if: always()
        run: |
          if [ -f server-responsibilities.pid ]; then kill "$(cat server-responsibilities.pid)" 2>/dev/null || true; fi

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true

      - name: Stop web server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi

  # ----- docker image build (sanity check, no push) ------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: spaces:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
