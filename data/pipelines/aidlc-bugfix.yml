name: aidlc-bugfix
version: 1
description: >
  Fix a specific bug. Incremental scope — no walking skeleton, no design
  ceremony. Reverse engineer the affected area, capture the bug requirement,
  patch, verify, ship.
steps:
  - id: state-init
    stage: init
    phase: initialization
  - id: research
    stage: research
    phase: inception
    role: architect
  - id: reverse-engineering
    stage: specify
    phase: inception
    role: developer
  - id: requirements-analysis
    stage: clarify
    phase: inception
    role: product
  - id: code-generation
    stage: implement
    phase: construction
    role: developer
  - id: build-and-test
    stage: verify
    phase: construction
    role: quality
    review: true
    humanGate: true
    onComplete:
      branch:
        - when: "verification_status == 'fail'"
          goto: code-generation
        - when: "true"
          goto: end
