# NOTE: container and volume names still say "pi-speckit-*" — preserved to
# keep existing Docker volumes intact after the rename to "spaces". Renaming
# the volume would orphan pgdata (projects/runs/OAuth tokens lost). Fresh
# installs can rename both freely.
#
# DEVELOPMENT ONLY. The Postgres container here is for local work and demos:
# it shares the host with the app, has default credentials, no backups and no
# failover. In production use an external, dedicated Postgres 16 instance and
# docker-compose.prod.yml (app + supervisor, no bundled database).
#
# The default `docker compose up` starts Postgres only, matching the local
# dev workflow (`bun run dev` + `bun run supervisor` on the host).
#
# To run the full dev stack in containers (app + supervisor + postgres), use:
#   docker compose --profile full up --build

services:
  postgres:
    image: postgres:16
    container_name: pi-speckit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidlc
      POSTGRES_PASSWORD: aidlc
      POSTGRES_DB: aidlc
    ports:
      - "5432:5432"
    volumes:
      - pi-speckit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidlc -d aidlc"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Web UI + API. Shares /data (cloned repos, governing workspaces, agent
  # sessions) with the workers so runs, clones and memory exports line up.
  app:
    profiles: ["full"]
    build: .
    image: spaces:latest
    container_name: spaces-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aidlc:aidlc@postgres:5432/aidlc
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - spaces-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  # One worker per active project, scaled on demand (recommended).
  supervisor:
    profiles: ["full"]
    build: .
    image: spaces:latest
    container_name: spaces-supervisor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aidlc:aidlc@postgres:5432/aidlc
      SUPERVISOR_MAX_WORKERS: "4"
      WORKER_IDLE_EXIT_SECONDS: "300"
    env_file:
      - .env
    volumes:
      - spaces-data:/data
    command: ["bun", "run", "src/supervisor.ts"]

  # Alternative to the supervisor: a single shared worker.
  #   docker compose --profile shared-worker up -d worker
  worker:
    profiles: ["shared-worker"]
    build: .
    image: spaces:latest
    container_name: spaces-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://aidlc:aidlc@postgres:5432/aidlc
      WORKER_ID: docker-worker-1
      WORKER_MAX_CONCURRENT_JOBS: "4"
    env_file:
      - .env
    volumes:
      - spaces-data:/data
    command: ["bun", "run", "src/worker.ts"]

volumes:
  pi-speckit-pgdata:
  # Cloned repositories, governing workspaces and Pi agent sessions.
  spaces-data:
