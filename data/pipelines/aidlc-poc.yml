name: aidlc-poc
version: 1
description: >
  Prove feasibility fast. Minimal depth. Init + intent capture + reverse
  engineering + requirements + code + build-and-test. Skip design ceremony.
  Advisory reviews (findings visible but not blocking).
steps:
  - id: state-init
    stage: init
    phase: initialization
  - id: intent-capture
    stage: specify
    phase: ideation
    role: product
  - id: reverse-engineering
    stage: plan
    phase: inception
    role: developer
  - id: requirements-analysis
    stage: tasks
    phase: inception
    role: product
  - id: code-generation
    stage: implement
    phase: construction
    role: developer
    parallel:
      source: parallel-workstreams.md
      maxConcurrency: 2
  - id: build-and-test
    stage: verify
    phase: construction
    role: quality
    review: true
