# The web service: public app, no workspace disk (SPACES_ROLE=web). It creates
# each project's worker (spaces-proj-<code>) in this namespace with its service
# account, and forwards that project's work to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spaces-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: spaces-web }
  template:
    metadata:
      labels: { app: spaces-web }
    spec:
      serviceAccountName: spaces-provisioner
      containers:
        - name: web
          # minikube: build into minikube's Docker (`eval $(minikube docker-env)`,
          # `docker build -t spaces:local .`). A registry image works the same way.
          image: spaces:local
          imagePullPolicy: IfNotPresent
          args: ["bun", "run", "src/standalone.ts"]
          envFrom:
            - secretRef: { name: spaces-secrets }
          env:
            - { name: SPACES_ROLE, value: web }
            - { name: PORT, value: "3000" }
            - { name: PROJECT_WORKER_PLATFORM, value: kubernetes }
            - { name: PROJECT_WORKER_IMAGE, value: "spaces:local" }
            - { name: PROJECT_WORKER_IMAGE_PULL_POLICY, value: IfNotPresent }
            - { name: PROJECT_WORKER_SECRET, value: spaces-secrets }
            # minikube rarely has 2 CPUs per project to spare; requests stay small.
            - { name: PROJECT_WORKER_VCPUS, value: "2" }
            - { name: PROJECT_WORKER_MEMORY_GB, value: "2" }
            - { name: PROJECT_WORKER_DISK_GB, value: "5" }
          ports:
            - { containerPort: 3000, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spaces-web
spec:
  selector: { app: spaces-web }
  ports:
    - { port: 3000, targetPort: 3000, name: http }
